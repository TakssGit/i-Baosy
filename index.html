<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSphere (i-baosy) - Plateforme d'Apprentissage & Révision</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="data.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col justify-between">
    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="goHome()">
            <span class="text-3xl">🌐</span>
            <div>
                <div class="flex items-center space-x-2">
                    <h1 class="text-xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">EduSphere</h1>
                    <span class="bg-indigo-600 text-white text-xs px-2 py-0.5 rounded-full font-semibold">i-baosy</span>
                </div>
                <p class="text-xs text-slate-400">De la 12ème à la Terminale BACC</p>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <button onclick="downloadProjectZip()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition shadow flex items-center space-x-1">
                <span>📦 Télécharger (.zip)</span>
            </button>
            <div class="bg-slate-700 px-3 py-1.5 rounded-lg text-sm font-mono text-emerald-400 border border-slate-600">
                Gains AdSense : $<span id="adRevenue">0.00</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main id="app-container" class="max-w-4xl w-full mx-auto p-6 flex-grow">
        <!-- Dynamically rendered views -->
    </main>

    <!-- Ad Banner Simulation -->
    <footer class="bg-slate-800 border-t border-slate-700 py-3 text-center text-xs text-slate-400">
        <div class="inline-block bg-slate-900 px-4 py-1 rounded border border-slate-700">
            📢 Espace Publicitaire Google AdSense (Bannière Responsive) - Impressions : <span id="adImpressions">0</span>
        </div>
    </footer>

    <script>
        // Web Audio API Synthesizer
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'success') {
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'error') {
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        // Ad simulator
        let adStats = { impressions: 0, revenue: 0.00 };
        function updateAds() {
            adStats.impressions += 1;
            adStats.revenue += 0.002;
            document.getElementById('adImpressions').innerText = adStats.impressions;
            document.getElementById('adRevenue').innerText = adStats.revenue.toFixed(3);
        }

        // Navigation State
        let currentView = 'home';
        let selectedLevel = null;
        let selectedSubject = null;
        let selectedChapter = null;
        let currentQuizIndex = 0;
        let userScore = 0;

        function goHome() {
            playSound('click');
            currentView = 'home';
            render();
        }

        function render() {
            updateAds();
            const container = document.getElementById('app-container');
            if (currentView === 'home') {
                container.innerHTML = `
                    <div class="text-center mb-8">
                        <h2 class="text-3xl font-extrabold mb-2 text-white">Bienvenue sur EduSphere / i-baosy</h2>
                        <p class="text-slate-400">Sélectionnez votre niveau scolaire pour accéder aux cours et exercices interactifs.</p>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        ${schoolDatabase.levels.map(level => `
                            <button onclick="selectLevel('${level}')" class="bg-slate-800 hover:bg-cyan-600 border border-slate-700 hover:border-cyan-500 p-4 rounded-xl text-center transition font-semibold shadow hover:scale-105">
                                ${level}
                            </button>
                        `).join('')}
                    </div>
                `;
            } else if (currentView === 'subjects') {
                container.innerHTML = `
                    <div class="mb-6 flex items-center justify-between">
                        <button onclick="goHome()" class="text-sm bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700">← Niveaux</button>
                        <span class="text-cyan-400 font-bold">Niveau : ${selectedLevel}</span>
                    </div>
                    <h2 class="text-2xl font-bold mb-6 text-center">Choisis ta matière</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        ${schoolDatabase.subjects.map(subject => `
                            <button onclick="selectSubject('${subject}')" class="bg-slate-800 hover:bg-indigo-600 border border-slate-700 hover:border-indigo-500 p-5 rounded-xl text-left transition font-semibold shadow flex items-center space-x-3">
                                <span class="text-2xl">📖</span>
                                <span>${subject}</span>
                            </button>
                        `).join('')}
                    </div>
                `;
            } else if (currentView === 'chapters') {
                const chapters = schoolDatabase.chapters.filter(c => c.level === selectedLevel && c.subject === selectedSubject);
                container.innerHTML = `
                    <div class="mb-6 flex items-center justify-between">
                        <button onclick="currentView='subjects'; render();" class="text-sm bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700">← Matières</button>
                        <span class="text-indigo-400 font-bold">${selectedLevel} / ${selectedSubject}</span>
                    </div>
                    <h2 class="text-2xl font-bold mb-6">Chapitres disponibles</h2>
                    ${chapters.length === 0 ? `
                        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 text-center text-slate-400">
                            Aucun chapitre répertorié pour le moment dans cette matière.
                        </div>
                    ` : `
                        <div class="space-y-4">
                            ${chapters.map(ch => `
                                <div class="bg-slate-800 border border-slate-700 p-5 rounded-xl flex justify-between items-center shadow">
                                    <div>
                                        <h3 class="text-lg font-bold text-white">${ch.title}</h3>
                                        <p class="text-sm text-slate-400 line-clamp-1">${ch.summary}</p>
                                    </div>
                                    <div class="flex space-x-2">
                                        <button onclick="openReader('${ch.id}')" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition">Lire</button>
                                        <button onclick="openQuiz('${ch.id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition">Quiz</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `}
                `;
            } else if (currentView === 'reader') {
                const ch = schoolDatabase.chapters.find(c => c.id === selectedChapter);
                container.innerHTML = `
                    <div class="mb-6 flex items-center justify-between">
                        <button onclick="currentView='chapters'; render();" class="text-sm bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700">← Chapitres</button>
                        <button onclick="speakSummary()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-sm font-medium flex items-center space-x-1">
                            <span>🔊 Écouter</span>
                        </button>
                    </div>
                    <div class="bg-slate-800 border border-slate-700 p-6 rounded-xl shadow">
                        <h2 class="text-2xl font-bold text-cyan-400 mb-4">${ch.title}</h2>
                        <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 text-slate-300 leading-relaxed mb-6">
                            ${ch.summary}
                        </div>
                        <button onclick="openQuiz('${ch.id}')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-bold transition shadow">
                            Lancer le Quiz →
                        </button>
                    </div>
                `;
            } else if (currentView === 'quiz') {
                const ch = schoolDatabase.chapters.find(c => c.id === selectedChapter);
                const q = ch.questions[currentQuizIndex];
                container.innerHTML = `
                    <div class="mb-6 flex items-center justify-between">
                        <button onclick="currentView='chapters'; render();" class="text-sm bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700">← Chapitres</button>
                        <span class="text-emerald-400 font-bold">Question ${currentQuizIndex + 1} / ${ch.questions.length}</span>
                    </div>
                    <div class="bg-slate-800 border border-slate-700 p-6 rounded-xl shadow">
                        <h3 class="text-xl font-bold mb-6 text-white">${q.question}</h3>
                        <div class="space-y-3 mb-6">
                            ${q.options.map((opt, idx) => `
                                <button onclick="checkAnswer(${idx})" class="w-full text-left bg-slate-900 hover:bg-slate-700 border border-slate-700 p-4 rounded-xl transition font-medium">
                                    ${opt}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (currentView === 'score') {
                const ch = schoolDatabase.chapters.find(c => c.id === selectedChapter);
                container.innerHTML = `
                    <div class="bg-slate-800 border border-slate-700 p-8 rounded-xl text-center shadow max-w-lg mx-auto">
                        <h2 class="text-3xl font-bold mb-4 text-white">Quiz Terminé ! 🎉</h2>
                        <p class="text-lg text-slate-300 mb-6">Votre score : <span class="font-bold text-emerald-400">${userScore} / ${ch.questions.length}</span></p>
                        <div class="flex justify-center space-x-4">
                            <button onclick="openQuiz('${ch.id}')" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-xl font-bold transition">Recommencer</button>
                            <button onclick="currentView='chapters'; render();" class="bg-slate-700 hover:bg-slate-600 text-white px-5 py-2.5 rounded-xl font-bold transition">Retour</button>
                        </div>
                    </div>
                `;
            }
        }

        function selectLevel(level) { playSound('click'); selectedLevel = level; currentView = 'subjects'; render(); }
        function selectSubject(subject) { playSound('click'); selectedSubject = subject; currentView = 'chapters'; render(); }
        function openReader(chapterId) { playSound('click'); selectedChapter = chapterId; currentView = 'reader'; render(); }
        function openQuiz(chapterId) { playSound('click'); selectedChapter = chapterId; currentQuizIndex = 0; userScore = 0; currentView = 'quiz'; render(); }

        function checkAnswer(selectedIndex) {
            const ch = schoolDatabase.chapters.find(c => c.id === selectedChapter);
            const q = ch.questions[currentQuizIndex];
            if (selectedIndex === q.correctAnswer) { playSound('success'); userScore++; } 
            else { playSound('error'); }

            currentQuizIndex++;
            if (currentQuizIndex < ch.questions.length) { render(); } 
            else { currentView = 'score'; render(); }
        }

        function speakSummary() {
            playSound('click');
            const ch = schoolDatabase.chapters.find(c => c.id === selectedChapter);
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(ch.summary);
                utterance.lang = 'fr-FR';
                window.speechSynthesis.speak(utterance);
            }
        }

        function downloadProjectZip() {
            playSound('click');
            const zip = new JSZip();
            zip.file("index.html", document.documentElement.outerHTML);
            zip.file("data.js", `const schoolDatabase = ${JSON.stringify(schoolDatabase, null, 2)};`);
            zip.generateAsync({ type: "blob" }).then(content => {
                const url = URL.createObjectURL(content);
                const a = document.createElement('a');
                a.href = url;
                a.download = "edusphere_ibaosy.zip";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });
        }

        render();
    </script>
</body>
</html>
