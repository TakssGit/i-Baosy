<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lycée i-baosy - Portail PWA & Révisions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen font-sans flex flex-col justify-between antialiased">
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm sticky top-0 z-50">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="setView('home')">
            <span class="text-3xl">🏫</span>
            <div>
                <div class="flex items-center space-x-2">
                    <h1 class="text-xl font-extrabold bg-gradient-to-r from-blue-700 to-indigo-600 bg-clip-text text-transparent">Lycée i-baosy</h1>
                    <span class="bg-blue-100 text-blue-800 text-xs px-2.5 py-0.5 rounded-full font-bold border border-blue-200">Officiel</span>
                </div>
                <p class="text-xs text-slate-500 font-medium">Portail PWA Pédagogique & Institutionnel</p>
            </div>
        </div>
        <nav class="flex items-center space-x-2 sm:space-x-4">
            <button onclick="setView('home')" class="text-xs sm:text-sm text-slate-600 hover:text-blue-700 font-semibold transition px-2 py-1">Accueil</button>
            <button onclick="setView('free_practice')" class="text-xs sm:text-sm text-blue-700 hover:text-blue-800 font-bold bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-xl border border-blue-200 transition">🎯 Quiz Libres</button>
            <button onclick="setView('profile')" class="text-xs sm:text-sm text-emerald-700 hover:text-emerald-800 font-bold bg-emerald-50 hover:bg-emerald-100 px-3 py-1.5 rounded-xl border border-emerald-200 transition">Carnet</button>
        </nav>
    </header>

    <main id="app-container" class="max-w-4xl w-full mx-auto p-4 sm:p-6 flex-grow"></main>

    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500 shadow-inner mt-8">
        <div class="inline-block bg-slate-50 px-4 py-1.5 rounded-lg border border-slate-200 font-mono text-slate-600 font-medium">
            Établissement Lycée i-baosy © 2026 — Plateforme d'Apprentissage Hors-Ligne 100% Sécurisée
        </div>
    </footer>

    <!-- Chargement des modules de la base de données -->
    <script src="db/metadata.js"></script>
    <script src="db/chapters.js"></script>
    <script src="db/users.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
            });
        }
    </script>
</body>
</html>
